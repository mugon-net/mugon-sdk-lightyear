.mugon-sdk-lightyear-changes:
  rules:
    - changes:
        - libraries/mugon-sdk-lightyear/**/*
        # It depends on the Bevy SDK by path.
        - libraries/mugon-sdk-bevy/**/*

mugon-sdk-lightyear:codestyle:
  stage: codestyle
  image: rust:1
  needs: []
  allow_failure: true
  rules: !reference [.mugon-sdk-lightyear-changes, rules]
  cache:
    key: mugon-sdk-lightyear-cargo
    paths:
      - libraries/mugon-sdk-lightyear/target/
      - .cargo-home/
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  script:
    - cd libraries/mugon-sdk-lightyear
    - cargo check --workspace --target wasm32-unknown-unknown --all-features
    - cargo clippy --workspace --target wasm32-unknown-unknown --all-features -- -D warnings
