name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Publishing is manual and a dry run unless explicitly switched off. The version comes
  # from Cargo.toml (bumped in the monorepo, which this repository mirrors) -- this
  # workflow never commits, so it can't diverge from the mirror.
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only check what would be published (untick to publish to crates.io)"
        required: true
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lightyear_mugon depends on ../../../mugon-sdk-bevy by path (the monorepo layout), which
      # does not exist in this mirror, so put the Bevy SDK's mirror there.
      - name: Check out mugon-sdk-bevy next to this repository
        run: git clone --depth 1 https://github.com/mugon-net/mugon-sdk-bevy.git "$GITHUB_WORKSPACE/../mugon-sdk-bevy"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target wasm32-unknown-unknown --all-features
      - run: cargo clippy --workspace --target wasm32-unknown-unknown --all-features -- -D warnings

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [check]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out mugon-sdk-bevy next to this repository
        run: git clone --depth 1 https://github.com/mugon-net/mugon-sdk-bevy.git "$GITHUB_WORKSPACE/../mugon-sdk-bevy"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Refuse to republish an existing version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lightyear_mugon") | .version')
          if curl -sf -A "lightyear_mugon release check" "https://crates.io/api/v1/crates/lightyear_mugon/$VERSION" >/dev/null; then
            echo "lightyear_mugon $VERSION is already published; bump the version in the monorepo first" >&2
            exit 1
          fi
      # Publishing replaces the path dependency by its version, which has to exist on crates.io.
      - name: Require the mugon-sdk-bevy release this version depends on
        run: |
          REQ=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lightyear_mugon") | .dependencies[] | select(.name == "mugon-sdk-bevy") | .req')
          BEVY_VERSION=${REQ#^}
          if ! curl -sf -A "lightyear_mugon release check" "https://crates.io/api/v1/crates/mugon-sdk-bevy/$BEVY_VERSION" >/dev/null; then
            echo "mugon-sdk-bevy $BEVY_VERSION is not on crates.io yet; publish it first" >&2
            exit 1
          fi
      - name: Publish
        run: cargo publish -p lightyear_mugon --target wasm32-unknown-unknown ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Tag the release
        if: ${{ !inputs.dry-run }}
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lightyear_mugon") | .version')
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
