[package]
name = "mugon-sdk-lightyear"
description = "Lightyear transport for games running on the Mugon platform"
homepage = "https://github.com/mugon-net/mugon-sdk-lightyear"
readme = "README.md"
keywords = ["bevy", "lightyear", "multiplayer", "wasm", "mugon"]
categories = ["game-development", "network-programming", "wasm"]
include = ["src/**/*", "README.md", "LICENSE-MIT", "Cargo.toml"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aeronet_io = "0.21.0"
bevy_app = "0.19.1"
bevy_ecs = "0.19.1"
lightyear = "0.30.1"
lightyear_connection = "0.30.1"
lightyear_core = "0.30.1"
lightyear_link = "0.30.1"
lightyear_raw_connection = { version = "0.30.1", features = ["client", "server"] }
mugon-sdk-bevy = { path = "../../../mugon-sdk-bevy", version = "0.4.0" }
tracing = "0.1.44"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom4 = { version = "0.4.3", package = "getrandom", features = ["wasm_js"] }
